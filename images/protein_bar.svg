<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Protein bar, half unwrapped. v-sport item icon. -->
  <defs>
    <linearGradient id="wrap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a4a2a"/>
      <stop offset="0.5" stop-color="#a3663a"/>
      <stop offset="1" stop-color="#6a3d21"/>
    </linearGradient>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9cdd4"/>
      <stop offset="0.5" stop-color="#eef1f5"/>
      <stop offset="1" stop-color="#aeb4bd"/>
    </linearGradient>
  </defs>

  <!-- foil wrapper, behind -->
  <g transform="rotate(-18 50 50)">
    <path d="M18 40 h64 v20 h-64 Z" fill="url(#foil)"/>
    <path d="M18 40 l-8 4 l8 4 Z" fill="#9aa1aa"/>
    <path d="M18 56 l-8 4 l8 4 Z" fill="#9aa1aa"/>
  </g>

  <!-- the bar itself, sticking out -->
  <g transform="rotate(-18 50 50)">
    <rect x="46" y="38" width="42" height="24" rx="3" fill="url(#wrap)"/>
    <!-- chocolate top, and the oat texture that stops it reading as a plank -->
    <rect x="46" y="38" width="42" height="7" rx="3" fill="#4e2d18" opacity="0.55"/>
    <g fill="#d8a56a" opacity="0.75">
      <circle cx="55" cy="51" r="2"/>
      <circle cx="63" cy="55" r="1.6"/>
      <circle cx="71" cy="49" r="1.8"/>
      <circle cx="79" cy="54" r="1.5"/>
      <circle cx="60" cy="47" r="1.3"/>
    </g>
  </g>
</svg>
