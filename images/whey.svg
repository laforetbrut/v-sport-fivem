<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!--
    Whey protein tub. v-sport item icon.
    Drawn to sit on the neutral grey of a qb-core / ox_inventory slot: nothing relies on the
    background being white, and the outline stays readable on a dark theme.
  -->
  <defs>
    <linearGradient id="tub" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f4a5a"/>
      <stop offset="0.35" stop-color="#5d6b7f"/>
      <stop offset="0.6" stop-color="#4a5666"/>
      <stop offset="1" stop-color="#333c48"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c8543a"/>
      <stop offset="0.4" stop-color="#e8734c"/>
      <stop offset="1" stop-color="#a8402c"/>
    </linearGradient>
  </defs>

  <!-- lid -->
  <rect x="26" y="14" width="48" height="12" rx="3" fill="#2c343e"/>
  <rect x="28" y="16" width="44" height="5" rx="2" fill="#414c59"/>

  <!-- body -->
  <path d="M28 26 h44 v54 a6 6 0 0 1 -6 6 H34 a6 6 0 0 1 -6 -6 Z" fill="url(#tub)"/>

  <!-- label band -->
  <rect x="28" y="42" width="44" height="22" fill="url(#band)"/>

  <!-- a dumbbell on the label, so the icon reads as sport at 32 px -->
  <g fill="#f4efe6">
    <rect x="44" y="51" width="12" height="4" rx="1"/>
    <rect x="39" y="47" width="4" height="12" rx="1.5"/>
    <rect x="57" y="47" width="4" height="12" rx="1.5"/>
    <rect x="35" y="49.5" width="3" height="7" rx="1"/>
    <rect x="62" y="49.5" width="3" height="7" rx="1"/>
  </g>

  <!-- highlight -->
  <rect x="32" y="28" width="5" height="56" rx="2.5" fill="#ffffff" opacity="0.10"/>
</svg>
